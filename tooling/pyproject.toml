[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dify-tooling"
version = "0.1.7"
description = "Dify add-on operational utilities."
readme = "README.md"
authors = [{ name = "neurwerk", email = "dev@neurwerk.com" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
dependencies = [
    "k8s-stack-tooling==0.15.6",
]

[tool.uv.sources]
k8s-stack-tooling = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/v0.15.6/k8s_stack_tooling-0.15.6-py3-none-any.whl"}
openbao-stack-setup = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/stack-setup-v0.8.3/openbao_stack_setup-0.8.3-py3-none-any.whl"}

[project.scripts]
dify-model-sync = "dify_tooling.model_sync.main:main"
dify-stage-payloads = "dify_tooling.cli:stage"
dify-validate = "dify_tooling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dify_tooling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dify_tooling"]

[tool.ruff.lint.per-file-ignores]
# Preserve the reviewed native payload byte-for-byte; its original lint gate remains in make check.
"**/payloads/sync_models.py" = ["E501", "N", "I", "UP"]

[tool.ruff.format]
exclude = ["**/payloads/sync_models.py"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/dify_tooling/payloads/sync_models.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49", "pytest>=8", "openbao-stack-setup==0.8.3"]

[project.urls]
Homepage = "https://github.com/neurwerk/k8s_stack_addon_dify"
Repository = "https://github.com/neurwerk/k8s_stack_addon_dify"
Issues = "https://github.com/neurwerk/k8s_stack_addon_dify/issues"
Security = "https://github.com/neurwerk/k8s_stack_addon_dify/security/policy"
