# =============================================================================
# ServiceAccount for the Dify OIDC configuration Job
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-keycloak-dify-oidc-service-account
  namespace: auth-keycloak
  labels:
    app.kubernetes.io/name: dify-oidc-service-account
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
