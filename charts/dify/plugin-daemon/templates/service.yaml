apiVersion: v1
kind: Service
metadata:
  name: frontend-dify-plugin-daemon-service
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: plugin-daemon
    app.kubernetes.io/instance: frontend-dify-plugin-daemon
    app.kubernetes.io/part-of: frontend-dify
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontendDify.pluginDaemon.ports.service.http }}
      targetPort: {{ .Values.frontendDify.pluginDaemon.ports.container.http }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: plugin-daemon
    app.kubernetes.io/instance: frontend-dify-plugin-daemon
