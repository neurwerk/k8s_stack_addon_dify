apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dify-plugin-daemon-deployment
  namespace: frontend-dify
  annotations:
    secret.reloader.stakater.com/reload: "frontend-dify-secret"
  labels:
    app.kubernetes.io/name: plugin-daemon
    app.kubernetes.io/instance: frontend-dify-plugin-daemon
    app.kubernetes.io/part-of: frontend-dify
spec:
  replicas: {{ .Values.frontendDify.pluginDaemon.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: plugin-daemon
      app.kubernetes.io/instance: frontend-dify-plugin-daemon
  template:
    metadata:
      annotations:
        checksum/gateway-adapter: {{ include (print $.Template.BasePath "/gateway-adapter.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: plugin-daemon
        app.kubernetes.io/instance: frontend-dify-plugin-daemon
        app.kubernetes.io/part-of: frontend-dify
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway-adapter
          image: {{ .Values.frontendDify.agentGateway.adapterImage | quote }}
          command: [nginx]
          args: [-c, /etc/nginx/gateway.conf, -g, "daemon off;"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.frontendDify.agentGateway.resources | nindent 12 }}
          volumeMounts:
            - {name: gateway-adapter, mountPath: /etc/nginx/gateway.conf, subPath: nginx.conf, readOnly: true}
            - {name: gateway-adapter-tmp, mountPath: /tmp}
          startupProbe:
            exec:
              command: [wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
            periodSeconds: 10
        - name: plugin-daemon
          image: {{ .Values.frontendDify.pluginDaemonImage }}
          imagePullPolicy: {{ .Values.frontendDify.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontendDify.pluginDaemon.ports.container.http }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.frontendDify.pluginDaemon.ports.container.http | quote }}
            - name: SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: PLUGIN_DAEMON_KEY
            - name: DIFY_INNER_API_URL
              value: http://frontend-dify-api-service:80
            - name: DIFY_INNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: PLUGIN_DAEMON_KEY
            - name: DB_USERNAME
              value: {{ .Values.frontendDify.postgres.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              value: {{ .Values.frontendDify.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.frontendDify.postgres.servicePort | quote }}
            - name: DB_DATABASE
              value: {{ .Values.frontendDify.postgres.pluginDatabase | quote }}
            - name: DB_DEFAULT_DATABASE
              value: {{ .Values.frontendDify.postgres.pluginDatabase | quote }}
            - name: DB_SSL_MODE
              value: disable
            - name: PLUGIN_STORAGE_TYPE
              value: local
            - name: PLUGIN_REMOTE_INSTALLING_HOST
              value: "0.0.0.0"
            - name: PLUGIN_REMOTE_INSTALLING_PORT
              value: "5003"
            - name: PLUGIN_WORKING_PATH
              value: /app/storage/cwd
            - name: PYTHON_ENV_INIT_TIMEOUT
              value: "320"
            - name: MAX_PLUGIN_PACKAGE_SIZE
              value: "52428800"
            - name: REDIS_HOST
              value: frontend-dify-redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: "0"
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          startupProbe:
            httpGet:
              path: /health/check
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/check
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/check
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.frontendDify.pluginDaemon.resources | nindent 12 }}
      volumes:
        - name: gateway-adapter
          configMap:
            name: frontend-dify-gateway-adapter
        - name: gateway-adapter-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: storage
          persistentVolumeClaim:
            claimName: frontend-dify-plugin-daemon-pvc
