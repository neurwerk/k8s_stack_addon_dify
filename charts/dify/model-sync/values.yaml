component: support
frontendDify:
  apiImage: ghcr.io/neurwerk/k8s-stack-addon-dify-api:1.17.1-kc-v1@sha256:62dd9ef6477a7030a3c992d7153bb0c72f82770249b91c36dfc12349f3a7dc8f
  pullPolicy: IfNotPresent
  modelSync:
    # Published tooling artifact; native API execution remains independently pinned.
    toolingImage: ghcr.io/neurwerk/k8s-stack-addon-dify-tooling:0.1.6@sha256:e916941b1d3fc770787625e1173ed33825b6b77d89c653eb0e43ace9d6f8e903
    # No Job is created by Helm; the local operator CLI snapshots this support.
    enabled: false
    projection: {}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
  postgres:
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    servicePort: 5432
    providerPodPort: 9712
    user: dify
    database: dify
  config:
    STORAGE_TYPE: local
    STORAGE_LOCAL_PATH: /app/api/storage
    PLUGIN_DAEMON_URL: http://frontend-dify-plugin-daemon-service:5002
