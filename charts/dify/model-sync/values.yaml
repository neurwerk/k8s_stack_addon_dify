component: support
frontendDify:
  apiImage: ghcr.io/neurwerk/k8s-stack-addon-dify-api:1.17.1-kc-v2@sha256:796078d336ebbd5f198188bc361eb1d5519c7f03fdd2daba5f3173507ee45566
  pullPolicy: IfNotPresent
  modelSync:
    # Published tooling artifact; native API execution remains independently pinned.
    toolingImage: ghcr.io/neurwerk/k8s-stack-addon-dify-tooling:0.1.7@sha256:4edc91dc592cf4f25200c7f24d24391a87fb8133314a29651ff1d9558a206f70
    # No Job is created by Helm; the local operator CLI snapshots this support.
    enabled: false
    projection: {}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
  postgres:
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    servicePort: 5432
    providerPodPort: 9712
    user: dify
    database: dify
  config:
    STORAGE_TYPE: local
    STORAGE_LOCAL_PATH: /app/api/storage
    PLUGIN_DAEMON_URL: http://frontend-dify-plugin-daemon-service:5002
