component: support
frontendDify:
  apiImage: ghcr.io/neurwerk/k8s-stack-addon-dify-api:1.17.1-kc-v3@sha256:61c3420702b932665c3fb276dfd538129b03e4b4a7623ccf72427397e83b25cb
  pullPolicy: IfNotPresent
  modelSync:
    # Published tooling artifact; native API execution remains independently pinned.
    toolingImage: ghcr.io/neurwerk/k8s-stack-addon-dify-tooling:0.1.9@sha256:dc8aec814acc0a2ccd1eb49bde67fb1a0d353c1adaa0e2421117842bce33f80c
    # No Job is created by Helm; the local operator CLI snapshots this support.
    enabled: false
    projection: {}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
  postgres:
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    servicePort: 5432
    providerPodPort: 9712
    user: dify
    database: dify
  config:
    STORAGE_TYPE: local
    STORAGE_LOCAL_PATH: /app/api/storage
    PLUGIN_DAEMON_URL: http://frontend-dify-plugin-daemon-service:5002
