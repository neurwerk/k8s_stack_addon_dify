apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontend-dify-api-pvc
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: frontend-dify-api
    app.kubernetes.io/part-of: frontend-dify
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.frontendDify.storage.size }}
  storageClassName: {{ .Values.frontendDify.storage.storageClassName }}
