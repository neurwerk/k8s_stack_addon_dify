apiVersion: v1
kind: Service
metadata:
  name: frontend-dify-api-service
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: frontend-dify-api
    app.kubernetes.io/part-of: frontend-dify
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontendDify.api.ports.service.http }}
      targetPort: {{ .Values.frontendDify.api.ports.container.http }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: frontend-dify-api
