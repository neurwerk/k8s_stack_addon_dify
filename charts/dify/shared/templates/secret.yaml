# =============================================================================
# Dify Secret - compound values from the OpenBao-backed Helm input
#
# Used by the Dify runtime sub-charts via envFrom secretRef.
#
# OpenBao-managed OIDC and AgentGateway credentials are supplied separately by
# frontend-dify-openbao-secret.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: frontend-dify-secret
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: shared
    app.kubernetes.io/instance: frontend-dify-shared
    app.kubernetes.io/part-of: frontend-dify
type: Opaque
stringData:
  # ── ESO-sourced secrets (from difySecrets.*) ──────────────────────────────
  SECRET_KEY: {{ .Values.difySecrets.SECRET_KEY | quote }}
  DB_PASSWORD: {{ .Values.difySecrets.POSTGRES_PASSWORD | quote }}
  REDIS_PASSWORD: {{ .Values.difySecrets.REDIS_PASSWORD | quote }}
  SANDBOX_API_KEY: {{ .Values.difySecrets.SANDBOX_API_KEY | quote }}
  PLUGIN_DAEMON_KEY: {{ .Values.difySecrets.PLUGIN_DAEMON_KEY | quote }}
  DIFY_AGENT_API_TOKEN: {{ .Values.difySecrets.DIFY_AGENT_API_TOKEN | quote }}
  DIFY_AGENT_SERVER_SECRET_KEY: {{ .Values.difySecrets.DIFY_AGENT_SERVER_SECRET_KEY | quote }}
  DIFY_AGENT_SANDBOX_AUTH_TOKEN: {{ .Values.difySecrets.DIFY_AGENT_SANDBOX_AUTH_TOKEN | quote }}

  # ── Constructed OIDC values ───────────────────────────────────────────────
  KEYCLOAK_OIDC_ISSUER_URL: {{ printf "https://%s/realms/%s" .Values.authKeycloak.hostname .Values.authKeycloak.realm | quote }}
  KEYCLOAK_OIDC_CLIENT_ID: {{ .Values.authKeycloak.difyClientId | quote }}

  # The local plugin runtime calls its loopback header adapter. The key stays
  # in the provider's encrypted api_key field, not undeclared extra_headers.
  LLM_PROXY_ENDPOINT: "http://127.0.0.1:8080/v1"
