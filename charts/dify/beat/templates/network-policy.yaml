apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-dify-beat-egress
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: beat
    app.kubernetes.io/instance: frontend-dify-beat
    app.kubernetes.io/part-of: frontend-dify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: beat
      app.kubernetes.io/instance: frontend-dify-beat
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-postgres-operations
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-operations
              app.kubernetes.io/instance: postgres-operations
      ports:
        - port: {{ .Values.frontendDify.postgres.providerPodPort }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: frontend-dify-redis
      ports:
        - port: 6379
          protocol: TCP
