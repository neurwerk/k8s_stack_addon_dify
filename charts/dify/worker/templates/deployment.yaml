apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dify-worker-deployment
  namespace: frontend-dify
  annotations:
    secret.reloader.stakater.com/reload: "frontend-dify-secret,frontend-dify-openbao-secret"
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: frontend-dify-worker
    app.kubernetes.io/part-of: frontend-dify
spec:
  replicas: {{ .Values.frontendDify.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/instance: frontend-dify-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/instance: frontend-dify-worker
        app.kubernetes.io/part-of: frontend-dify
    spec:
      containers:
        - name: worker
          image: {{ .Values.frontendDify.apiImage }}
          imagePullPolicy: {{ .Values.frontendDify.pullPolicy }}
          env:
            - name: MODE
              value: {{ .Values.frontendDify.config.MODE | quote }}
            - name: DB_HOST
              value: {{ .Values.frontendDify.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.frontendDify.postgres.servicePort | quote }}
            - name: REDIS_HOST
              value: frontend-dify-redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: DB_USERNAME
              value: {{ .Values.frontendDify.postgres.user | quote }}
            - name: DB_DATABASE
              value: {{ .Values.frontendDify.postgres.database | quote }}
            - name: PGSSLMODE
              value: disable
            - name: LOG_LEVEL
              value: {{ .Values.frontendDify.config.LOG_LEVEL | quote }}
            - name: STORAGE_TYPE
              value: {{ .Values.frontendDify.config.STORAGE_TYPE | quote }}
            - name: STORAGE_LOCAL_PATH
              value: {{ .Values.frontendDify.config.STORAGE_LOCAL_PATH | quote }}
            - name: VECTOR_STORE
              value: {{ .Values.frontendDify.config.VECTOR_STORE | quote }}
            - name: PGVECTOR_HOST
              value: {{ .Values.frontendDify.postgres.host | quote }}
            - name: PGVECTOR_PORT
              value: {{ .Values.frontendDify.postgres.servicePort | quote }}
            - name: PGVECTOR_USER
              value: {{ .Values.frontendDify.postgres.user | quote }}
            - name: PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: DB_PASSWORD
            - name: PGVECTOR_DATABASE
              value: {{ .Values.frontendDify.postgres.vectorDatabase | quote }}
            - name: PLUGIN_DAEMON_URL
              value: {{ .Values.frontendDify.config.PLUGIN_DAEMON_URL | quote }}
            - name: INNER_API_KEY_FOR_PLUGIN
              valueFrom:
                secretKeyRef: { name: frontend-dify-secret, key: PLUGIN_DAEMON_KEY }
            - name: AGENT_BACKEND_BASE_URL
              value: http://frontend-dify-agent-backend-service:5050
            - name: AGENT_BACKEND_API_TOKEN
              valueFrom:
                secretKeyRef: { name: frontend-dify-secret, key: DIFY_AGENT_API_TOKEN }
            - name: KEYCLOAK_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: frontend-dify-openbao-secret, key: KEYCLOAK_OIDC_CLIENT_SECRET }
            - name: SANDBOX_API_URL
              value: {{ .Values.frontendDify.config.SANDBOX_API_URL | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: REDIS_PASSWORD
            - name: CELERY_BROKER_URL
              value: redis://:$(REDIS_PASSWORD)@frontend-dify-redis-service:6379/0
          envFrom:
            - secretRef:
                name: frontend-dify-secret
          volumeMounts:
            - name: storage
              mountPath: /app/api/storage
              subPath: storage
          resources:
            {{- toYaml .Values.frontendDify.worker.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: frontend-dify-api-pvc
