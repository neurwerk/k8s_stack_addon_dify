apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dify-web-gui-deployment
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: web-gui
    app.kubernetes.io/instance: frontend-dify-web-gui
    app.kubernetes.io/part-of: frontend-dify
spec:
  replicas: {{ .Values.frontendDify.webGui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web-gui
      app.kubernetes.io/instance: frontend-dify-web-gui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-gui
        app.kubernetes.io/instance: frontend-dify-web-gui
        app.kubernetes.io/part-of: frontend-dify
    spec:
      containers:
        - name: web-gui
          image: {{ .Values.frontendDify.webImage }}
          imagePullPolicy: {{ .Values.frontendDify.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontendDify.webGui.ports.container.http }}
              protocol: TCP
          env:
            - name: CONSOLE_API_URL
              value: {{ printf "https://%s" .Values.frontendDify.hostname | quote }}
            - name: APP_API_URL
              value: {{ printf "https://%s" .Values.frontendDify.hostname | quote }}
            - name: NEXT_PUBLIC_COOKIE_DOMAIN
              value: {{ .Values.frontendDify.hostname | quote }}
            - name: NEXT_PUBLIC_SOCKET_URL
              value: {{ printf "https://%s" .Values.frontendDify.hostname | quote }}
            - name: NEXT_PUBLIC_ENABLE_AGENT_V2
              value: "true"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontendDify.webGui.resources | nindent 12 }}
