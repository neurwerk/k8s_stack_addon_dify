{{- if .Values.externalGateway.enabled }}
{{- $hostname := required "external Gateway hostname is required" .Values.frontendDify.hostname }}
{{- if eq $hostname "place.holder" }}{{ fail "place.holder cannot be used for an external Gateway" }}{{ end }}
# =============================================================================
# Dify Web GUI External HTTPRoute
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-dify-web-gui-external-httproute
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: web-gui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: frontend-dify
spec:
  parentRefs:
    - name: frontend-dify-web-gui-gateway
      namespace: frontend-dify
      sectionName: websecure
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /console/api
      backendRefs:
        - name: frontend-dify-api-service
          port: {{ .Values.frontendDify.api.ports.service.http }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: frontend-dify-api-service
          port: {{ .Values.frontendDify.api.ports.service.http }}
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: frontend-dify-api-service
          port: {{ .Values.frontendDify.api.ports.service.http }}
    - matches:
        - path:
            type: PathPrefix
            value: /files
      backendRefs:
        - name: frontend-dify-api-service
          port: {{ .Values.frontendDify.api.ports.service.http }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-dify-web-gui-service
          port: {{ .Values.frontendDify.webGui.ports.service.http }}
{{- end }}
