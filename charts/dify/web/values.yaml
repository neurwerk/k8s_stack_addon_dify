# IMAGE SOURCE: Neurwerk Dify add-on
# Dify addon: langgenius/dify-web + Dify addon Keycloak OIDC overlay
# Pinned here (chart defaults)
dify:
  enabled: false
  hostname: ""
frontendDify:
  websocket:
    ports:
      service: { http: 80 }
  webImage: ghcr.io/neurwerk/k8s-stack-addon-dify-web:1.17.1-kc-v3@sha256:db22f42339626fb286bf2b111074c56d337c6fe70b3068d2cfb035f4890c906c
  pullPolicy: IfNotPresent
  api:
    ports:
      service:   { http: 80 }
  webGui:
    ports:
      container: { http: 3000 }
      service:   { http: 80 }
      gateway:   { tls: 443 }
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

externalGateway:
  enabled: false

publicCertificates:
  useProduction: false
