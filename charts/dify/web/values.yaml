# IMAGE SOURCE: Neurwerk Dify add-on
# Dify addon: langgenius/dify-web + Dify addon Keycloak OIDC overlay
# Pinned here (chart defaults)
dify:
  enabled: false
  hostname: ""
frontendDify:
  websocket:
    ports:
      service: { http: 80 }
  webImage: ghcr.io/neurwerk/k8s-stack-addon-dify-web:1.17.1-kc-v2@sha256:b9ad455491ad8bde8266291f0de64b0690989325735a64224b78a11b54443709
  pullPolicy: IfNotPresent
  api:
    ports:
      container: { http: 5001 }
      service:   { http: 80 }
  webGui:
    ports:
      container: { http: 3000 }
      service:   { http: 80 }
      gateway:   { tls: 443 }
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

externalGateway:
  enabled: false

publicCertificates:
  useProduction: false
