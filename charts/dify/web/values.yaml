# IMAGE SOURCE: Neurwerk Dify add-on
# Dify addon: langgenius/dify-web + Dify addon Keycloak OIDC overlay
# Pinned here (chart defaults)
frontendDify:
  webImage: ghcr.io/neurwerk/k8s-stack-addon-dify-web:1.17.1-kc-v1@sha256:05e5297b43855a8ea6b8ec2a1fe631567f8b25146075e9e9a8ece3abc3e638c9
  pullPolicy: IfNotPresent
  api:
    ports:
      container: { http: 5001 }
      service:   { http: 80 }
  webGui:
    ports:
      container: { http: 3000 }
      service:   { http: 80 }
      gateway:   { tls: 443 }
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  hostname: ""

externalGateway:
  enabled: false

publicCertificates:
  useProduction: false
