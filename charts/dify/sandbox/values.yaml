# IMAGE SOURCE: upstream
# Pulled directly from: docker.io/langgenius/dify-sandbox
# Pinned here (chart defaults)
frontendDify:
  sandboxImage: docker.io/langgenius/dify-sandbox:0.2.15@sha256:750e1111426ef31a9217b81c98cccfb750f17b182af3221102e420afa9f0928e
  pullPolicy: IfNotPresent
  sandbox:
    ports:
      container: { http: 8194 }
      service:   { http: 8194 }
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  storage:
    dependenciesSize: 2Gi
    storageClassName: infra-rook-ceph-rbd
