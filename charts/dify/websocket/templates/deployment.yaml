apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dify-websocket-deployment
  namespace: frontend-dify
  annotations:
    secret.reloader.stakater.com/reload: "frontend-dify-openbao-secret,frontend-dify-secret"
  labels:
    app.kubernetes.io/name: websocket
    app.kubernetes.io/instance: frontend-dify-websocket
    app.kubernetes.io/part-of: frontend-dify
spec:
  replicas: {{ .Values.frontendDify.websocket.replicas }}
  # Never overlap collaboration processes during an upgrade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: websocket
      app.kubernetes.io/instance: frontend-dify-websocket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: websocket
        app.kubernetes.io/instance: frontend-dify-websocket
        app.kubernetes.io/part-of: frontend-dify
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The API owns the ReadWriteOnce claim; both pods must use the same node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: api
                  app.kubernetes.io/instance: frontend-dify-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: websocket
          image: {{ .Values.frontendDify.apiImage }}
          imagePullPolicy: {{ .Values.frontendDify.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.frontendDify.websocket.ports.container.http }}
              protocol: TCP
          # Keep the upstream entrypoint and API runtime configuration, without
          # rerunning migrations or the API's model-provider bootstrap.
          env:
            - name: MODE
              value: api
            - name: MIGRATION_ENABLED
              value: "false"
            - name: SERVER_WORKER_AMOUNT
              value: "1"
            - name: SERVER_WORKER_CLASS
              value: geventwebsocket.gunicorn.workers.GeventWebSocketWorker
            - name: SERVER_WORKER_CONNECTIONS
              value: "1000"
            - name: GUNICORN_TIMEOUT
              value: "360"
            - name: DB_HOST
              value: {{ .Values.frontendDify.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.frontendDify.postgres.servicePort | quote }}
            - name: DB_USERNAME
              value: {{ .Values.frontendDify.postgres.user | quote }}
            - name: DB_DATABASE
              value: {{ .Values.frontendDify.postgres.database | quote }}
            - name: PGSSLMODE
              value: disable
            - name: REDIS_HOST
              value: frontend-dify-redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: LOG_LEVEL
              value: {{ .Values.frontendDify.config.LOG_LEVEL | quote }}
            - name: CONSOLE_API_URL
              value: {{ printf "https://%s" .Values.dify.hostname | quote }}
            - name: CONSOLE_WEB_URL
              value: {{ printf "https://%s" .Values.dify.hostname | quote }}
            - name: COOKIE_DOMAIN
              value: {{ .Values.dify.hostname | quote }}
            - name: SERVICE_API_URL
              value: {{ printf "http://frontend-dify-api-service:%s" (.Values.frontendDify.api.ports.service.http | toString) | quote }}
            - name: STORAGE_TYPE
              value: {{ .Values.frontendDify.config.STORAGE_TYPE | quote }}
            - name: STORAGE_LOCAL_PATH
              value: {{ .Values.frontendDify.config.STORAGE_LOCAL_PATH | quote }}
            - name: VECTOR_STORE
              value: {{ .Values.frontendDify.config.VECTOR_STORE | quote }}
            - name: PGVECTOR_HOST
              value: {{ .Values.frontendDify.postgres.host | quote }}
            - name: PGVECTOR_PORT
              value: {{ .Values.frontendDify.postgres.servicePort | quote }}
            - name: PGVECTOR_USER
              value: {{ .Values.frontendDify.postgres.user | quote }}
            - name: PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: DB_PASSWORD
            - name: PGVECTOR_DATABASE
              value: {{ .Values.frontendDify.postgres.vectorDatabase | quote }}
            - name: PLUGIN_DAEMON_URL
              value: {{ .Values.frontendDify.config.PLUGIN_DAEMON_URL | quote }}
            - name: SANDBOX_API_URL
              value: {{ .Values.frontendDify.config.SANDBOX_API_URL | quote }}
            - name: INNER_API_KEY_FOR_PLUGIN
              valueFrom:
                secretKeyRef: { name: frontend-dify-secret, key: PLUGIN_DAEMON_KEY }
            - name: AGENT_BACKEND_BASE_URL
              value: http://frontend-dify-agent-backend-service:5050
            - name: AGENT_BACKEND_API_TOKEN
              valueFrom:
                secretKeyRef: { name: frontend-dify-secret, key: DIFY_AGENT_API_TOKEN }
            - name: ENABLE_SOCIAL_OAUTH_LOGIN
              value: {{ .Values.frontendDify.config.ENABLE_SOCIAL_OAUTH_LOGIN | quote }}
            - name: ALLOW_REGISTER
              value: {{ .Values.frontendDify.config.ALLOW_REGISTER | quote }}
            - name: ALLOW_CREATE_WORKSPACE
              value: {{ .Values.frontendDify.config.ALLOW_CREATE_WORKSPACE | quote }}
            - name: ALLOW_SSO_REGISTER
              value: {{ .Values.frontendDify.config.ALLOW_SSO_REGISTER | quote }}
            - name: ENFORCE_SINGLE_WORKSPACE
              value: {{ .Values.frontendDify.config.ENFORCE_SINGLE_WORKSPACE | quote }}
            - name: ENABLE_EMAIL_PASSWORD_LOGIN
              value: {{ .Values.frontendDify.config.ENABLE_EMAIL_PASSWORD_LOGIN | quote }}
            - name: ENABLE_EMAIL_CODE_LOGIN
              value: {{ .Values.frontendDify.config.ENABLE_EMAIL_CODE_LOGIN | quote }}
            - name: AUTO_SETUP_ADMIN_EMAIL
              value: {{ .Values.frontendDify.config.AUTO_SETUP_ADMIN_EMAIL | quote }}
            - name: AUTO_SETUP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-openbao-secret
                  key: AUTO_SETUP_ADMIN_PASSWORD
            - name: DEFAULT_WORKSPACE_NAME
              value: {{ .Values.frontendDify.config.DEFAULT_WORKSPACE_NAME | quote }}
            - name: KEYCLOAK_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-openbao-secret
                  key: KEYCLOAK_OIDC_CLIENT_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-dify-secret
                  key: REDIS_PASSWORD
            - name: CELERY_BROKER_URL
              value: redis://:$(REDIS_PASSWORD)@frontend-dify-redis-service:6379/0
          envFrom:
            - secretRef:
                name: frontend-dify-secret
          volumeMounts:
            - name: storage
              mountPath: /app/api/storage
              subPath: storage
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.frontendDify.websocket.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: frontend-dify-api-pvc
