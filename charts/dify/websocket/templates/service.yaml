apiVersion: v1
kind: Service
metadata:
  name: frontend-dify-websocket-service
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: websocket
    app.kubernetes.io/instance: frontend-dify-websocket
    app.kubernetes.io/part-of: frontend-dify
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontendDify.websocket.ports.service.http }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: websocket
    app.kubernetes.io/instance: frontend-dify-websocket
