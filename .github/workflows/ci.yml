# Validation only; API/Web image builds remain operator-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Reviewed candidate for source CI only; tag-driven publication requires stable Base.
  BASE_REF: 1bea577c470a2fecda554534303e9e659acf24fe

jobs:
  validate:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.7"

      - name: Install locked lint tools
        run: uv sync --locked --dev

      - name: Check out the selected Base baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neurwerk/k8s_stack_base
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'v0.4.0' || env.BASE_REF }}
          path: .ci/base

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4

      - name: Install Kustomize
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          name: kustomize
          version: v5.8.1

      - name: Install kubeconform
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          name: kubeconform
          version: 0.8.0

      - name: Install HTTP boundary test runtime
        run: sudo apt-get update && sudo apt-get install --yes nginx

      - name: Run full validation
        env:
          DIFY_TEST_NGINX: /usr/sbin/nginx
        run: make check BASE_REPO="$GITHUB_WORKSPACE/.ci/base"
