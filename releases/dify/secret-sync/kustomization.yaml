apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - shared.yaml
  - runtime.yaml
  - oidc.yaml
  - postgres.yaml
  - managed-keys.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dify-defaults
    namespace: frontend-dify
    files:
      - values.yaml=defaults.yaml
  - name: frontend-dify-app-defaults
    namespace: frontend-dify
    files:
      - values.yaml=app-defaults.yaml
