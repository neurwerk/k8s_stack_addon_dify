apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-dify-external-secrets
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-dify-secret-sync
    app.kubernetes.io/part-of: frontend-dify
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: frontend-dify-openbao-secret-store
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-dify-secret-sync
    app.kubernetes.io/part-of: frontend-dify
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: addon-dify-runtime
          serviceAccountRef:
            name: frontend-dify-external-secrets
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-dify-runtime-secret
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-dify-secret-sync
    app.kubernetes.io/part-of: frontend-dify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-dify-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-dify-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
          app.kubernetes.io/name: shared
          app.kubernetes.io/instance: frontend-dify-shared
          app.kubernetes.io/part-of: frontend-dify
      templateFrom:
        - target: Data
          configMap:
            name: frontend-dify-secret-template
            items:
              - key: KEYCLOAK_OIDC_ISSUER_URL
                templateAs: Values
              - key: KEYCLOAK_OIDC_CLIENT_ID
                templateAs: Values
              - key: LLM_PROXY_ENDPOINT
                templateAs: Values
      data:
        SECRET_KEY: "{{ .secretKey }}"
        DB_PASSWORD: "{{ .postgresPassword }}"
        REDIS_PASSWORD: "{{ .redisPassword }}"
        SANDBOX_API_KEY: "{{ .sandboxApiKey }}"
        PLUGIN_DAEMON_KEY: "{{ .pluginDaemonKey }}"
        DIFY_AGENT_API_TOKEN: "{{ .difyAgentApiToken }}"
        DIFY_AGENT_SERVER_SECRET_KEY: "{{ .difyAgentServerSecretKey }}"
        DIFY_AGENT_SANDBOX_AUTH_TOKEN: "{{ .difyAgentSandboxAuthToken }}"
  data:
    - secretKey: secretKey
      remoteRef:
        key: addons/dify/runtime
        property: secretKey
    - secretKey: postgresPassword
      remoteRef:
        key: addons/dify/database
        property: postgresPassword
    - secretKey: redisPassword
      remoteRef:
        key: addons/dify/runtime
        property: redisPassword
    - secretKey: sandboxApiKey
      remoteRef:
        key: addons/dify/runtime
        property: sandboxApiKey
    - secretKey: pluginDaemonKey
      remoteRef:
        key: addons/dify/runtime
        property: pluginDaemonKey
    - secretKey: difyAgentApiToken
      remoteRef:
        key: addons/dify/runtime
        property: difyAgentApiToken
    - secretKey: difyAgentServerSecretKey
      remoteRef:
        key: addons/dify/runtime
        property: difyAgentServerSecretKey
    - secretKey: difyAgentSandboxAuthToken
      remoteRef:
        key: addons/dify/runtime
        property: difyAgentSandboxAuthToken
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-dify-openbao-secret
  namespace: frontend-dify
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-dify-secret-sync
    app.kubernetes.io/part-of: frontend-dify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-dify-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-dify-openbao-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: KEYCLOAK_OIDC_CLIENT_SECRET
      remoteRef:
        key: addons/dify/oidc/browser
        property: difyOidcClientSecret
    - secretKey: AUTO_SETUP_ADMIN_PASSWORD
      remoteRef:
        key: addons/dify/admin
        property: initPassword
    - secretKey: AGENTGATEWAY_API_KEY
      remoteRef:
        key: addons/dify/gateway/key
        property: agentgatewayApiKey
