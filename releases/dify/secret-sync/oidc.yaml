apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dify-oidc-secret
  namespace: auth-keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: auth-keycloak-openbao-secret-store
    kind: SecretStore
  target:
    name: dify-oidc-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: difyOidcClientSecret
      remoteRef:
        key: addons/dify/oidc/browser
        property: difyOidcClientSecret
    - secretKey: difyAgentgatewayClientSecret
      remoteRef:
        key: addons/dify/oidc/service
        property: difyAgentgatewayClientSecret
