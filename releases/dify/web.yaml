apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-dify-web-gui
  namespace: frontend-dify
spec:
  releaseName: frontend-dify-web-gui
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: frontend-dify-shared
      namespace: frontend-dify
    - name: traefik
      namespace: kube-system
    - name: cert-manager-issuers
      namespace: infra-cert-manager
    - name: frontend-dify-api
      namespace: frontend-dify
  chart:
    spec:
      chart: ./charts/dify/web
      sourceRef:
        kind: GitRepository
        name: dify-addon
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dify-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: frontend-dify-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: dify-product-values
      valuesKey: values.yaml
