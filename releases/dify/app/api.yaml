apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-dify-api
  namespace: frontend-dify
spec:
  releaseName: frontend-dify-api
  interval: 5m
  timeout: 60m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: frontend-dify-shared
      namespace: frontend-dify
    - name: postgres-operations
      namespace: infra-postgres-operations
    - name: frontend-dify-postgres
      namespace: infra-postgres-operations
    - name: frontend-dify-redis
      namespace: frontend-dify
    - name: frontend-dify-plugin-daemon
      namespace: frontend-dify
    - name: frontend-dify-agent
      namespace: frontend-dify
    - name: frontend-dify-sandbox
      namespace: frontend-dify
    - name: keycloak-dify-oidc
      namespace: auth-keycloak
    - name: agentgateway
      namespace: infra-agentgateway
    - name: agentgateway-extproc
      namespace: monitor-agentgateway-extproc
  chart:
    spec:
      chart: ./charts/dify/api
      sourceRef:
        kind: GitRepository
        name: dify-addon
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dify-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: frontend-dify-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: dify-product-values
      valuesKey: values.yaml
