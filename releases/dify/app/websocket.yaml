apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-dify-websocket
  namespace: frontend-dify
spec:
  releaseName: frontend-dify-websocket
  interval: 5m
  timeout: 20m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: frontend-dify-shared
      namespace: frontend-dify
    # API readiness gates migrations, bootstrap and the shared storage claim.
    - name: frontend-dify-api
      namespace: frontend-dify
    - name: frontend-dify-redis
      namespace: frontend-dify
  chart:
    spec:
      chart: ./charts/dify/websocket
      sourceRef:
        kind: GitRepository
        name: dify-addon
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dify-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: frontend-dify-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: dify-product-values
      valuesKey: values.yaml
