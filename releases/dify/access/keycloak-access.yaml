apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-dify-access
  namespace: auth-keycloak
spec:
  releaseName: auth-keycloak-dify-access
  interval: 5m
  timeout: 15m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: keycloak-realm-roles
      namespace: auth-keycloak
  chart:
    spec:
      chart: ./charts/keycloak/addon-access
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dify-keycloak-access-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: auth-keycloak-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: keycloak-product-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: dify-keycloak-access-values
      valuesKey: values.yaml
  values:
    k8sTools:
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.18.3@sha256:fa30429bb143f0176867741dcf55eae422d69157b5f033e9d007745dd3639d79
