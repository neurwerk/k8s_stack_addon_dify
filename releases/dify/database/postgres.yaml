apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-dify-postgres
  namespace: infra-postgres-operations
spec:
  releaseName: frontend-dify-postgres
  interval: 5m
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: postgres-operations
      namespace: infra-postgres-operations
  chart:
    spec:
      chart: ./charts/postgres/addon
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  values:
    addon:
      role: dify
      passwordSecret: frontend-dify-postgres-password
      databases:
        - name: dify
          vector: false
        - name: dify_plugin
          vector: false
        - name: dify_vector
          vector: true
