apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frontend-dify
resources:
  - agent.yaml
  - api.yaml
  - beat.yaml
  - plugin-daemon.yaml
  - redis.yaml
  - sandbox.yaml
  - shared.yaml
  - web.yaml
  - worker.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dify-defaults
    files:
      - values.yaml=defaults.yaml
  - name: frontend-dify-app-defaults
    files:
      - values.yaml=app-defaults.yaml
