apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-dify-oidc
  namespace: auth-keycloak
spec:
  releaseName: auth-keycloak-dify-oidc
  interval: 5m
  timeout: 15m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: keycloak
      namespace: auth-keycloak
  chart:
    spec:
      chart: ./charts/keycloak/oidc/dify
      sourceRef:
        kind: GitRepository
        name: dify-addon
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dify-oidc-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: auth-keycloak-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: keycloak-product-values
      valuesKey: values.yaml
