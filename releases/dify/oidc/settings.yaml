apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dify-oidc-settings
  namespace: auth-keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/dify/oidc
      sourceRef: {kind: GitRepository, name: dify-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: dify-oidc-defaults}
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: keycloak-product-values}
