apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-dify-agentgateway-oidc
  namespace: auth-keycloak
spec:
  releaseName: auth-keycloak-dify-agentgateway-oidc
  interval: 5m
  timeout: 15m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: keycloak-agentgateway-oidc
      namespace: auth-keycloak
    - name: keycloak-dify-access
      namespace: auth-keycloak
  chart:
    spec:
      chart: ./charts/dify/oidc-agentgateway
      sourceRef:
        kind: GitRepository
        name: dify-addon
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dify-oidc-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: auth-keycloak-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-openrouter-catalog-values
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: keycloak-product-values
      valuesKey: values.yaml
